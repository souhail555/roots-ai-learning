<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <!-- Background with dark blue gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#0D1A30"/>
    </linearGradient>
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#bgGradient)"/>
  
  <!-- Brain hemisphere with circuit pattern -->
  <g stroke="url(#circuitGradient)" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Left hemisphere outline -->
    <path d="M70 80 C50 70 50 60 70 50 C90 40 110 40 130 50 C150 40 170 40 190 50 C210 60 210 70 190 80 C170 90 150 90 130 90 C110 90 90 90 70 80"/>
    
    <!-- Circuit traces -->
    <path d="M75 65 L95 55 L115 65"/>
    <path d="M95 75 L115 65 L135 75"/>
    <path d="M115 85 L135 75 L155 85"/>
    <path d="M85 70 L105 80 L125 70"/>
    <path d="M105 60 L125 50 L145 60"/>
    <path d="M95 55 L115 45 L135 55"/>
    <path d="M85 75 L105 85 L125 75"/>
    <path d="M105 70 L125 60 L145 70"/>
    <path d="M125 65 L145 55 L165 65"/>
    
    <!-- Circuit nodes -->
    <circle cx="85" cy="70" r="3" fill="#4FC3F7"/>
    <circle cx="125" cy="70" r="3" fill="#4FC3F7"/>
    <circle cx="105" cy="85" r="3" fill="#4FC3F7"/>
    <circle cx="115" cy="45" r="3" fill="#4FC3F7"/>
    <circle cx="95" cy="60" r="2.5" fill="#4FC3F7"/>
    <circle cx="135" cy="60" r="3" fill="#4FC3F7"/>
    <circle cx="145" cy="65" r="2.5" fill="#4FC3F7"/>
    <circle cx="125" cy="55" r="2" fill="#4FC3F7"/>
  </g>
  
  <!-- Z shape connecting brain to roots -->
  <g stroke="url(#circuitGradient)" stroke-width="3" fill="none" filter="url(#glow)">
    <!-- Top horizontal of Z -->
    <path d="M60 90 L150 90"/>
    <!-- Diagonal of Z -->
    <path d="M150 90 L100 130"/>
    <!-- Bottom horizontal of Z -->
    <path d="M100 130 L200 130"/>
    
    <!-- Connection to roots -->
    <path d="M200 130 L200 160"/>
  </g>
  
  <!-- Root system -->
  <g stroke="url(#circuitGradient)" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Main roots extending from Z -->
    <path d="M60 160 L50 200 L40 220"/>
    <path d="M100 160 L100 200 L100 220"/>
    <path d="M140 160 L150 200 L160 220"/>
    <path d="M180 160 L200 200 L220 220"/>
    
    <!-- Secondary branches -->
    <path d="M50 200 L30 210"/>
    <path d="M100 200 L80 210"/>
    <path d="M100 200 L120 210"/>
    <path d="M150 200 L170 210"/>
    <path d="M200 200 L230 210"/>
    
    <!-- Root terminals -->
    <circle cx="40" cy="220" r="3" fill="#4FC3F7"/>
    <circle cx="100" cy="220" r="3" fill="#4FC3F7"/>
    <circle cx="160" cy="220" r="3" fill="#4FC3F7"/>
    <circle cx="220" cy="220" r="3" fill="#4FC3F7"/>
    <circle cx="30" cy="210" r="2" fill="#4FC3F7"/>
    <circle cx="80" cy="210" r="2" fill="#4FC3F7"/>
    <circle cx="120" cy="210" r="2" fill="#4FC3F7"/>
    <circle cx="170" cy="210" r="2" fill="#4FC3F7"/>
    <circle cx="230" cy="210" r="2" fill="#4FC3F7"/>
  </g>
  
  <!-- Horizontal connectors -->
  <g stroke="url(#circuitGradient)" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M40 220 L70 220"/>
    <path d="M80 220 L90 220"/>
    <path d="M110 220 L130 220"/>
    <path d="M140 220 L150 220"/>
    <path d="M170 220 L190 220"/>
    <path d="M200 220 L220 220"/>
  </g>
  
  <!-- Text: ROOTS-AI™ -->
  <text x="150" y="280" text-anchor="middle" fill="#4FC3F7" font-family="Arial, sans-serif" font-weight="bold" font-size="32" letter-spacing="2" filter="url(#glow)">ROOTS-AI<tspan font-size="20" dy="-8">™</tspan></text>
  
  <!-- Text: BIOLOGICAL INTELLIGENCE -->
  <text x="150" y="320" text-anchor="middle" fill="#4FC3F7" font-family="Arial, sans-serif" font-weight="normal" font-size="14" letter-spacing="6" opacity="0.9">BIOLOGICAL INTELLIGENCE</text>
</svg>