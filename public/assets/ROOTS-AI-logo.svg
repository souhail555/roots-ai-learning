<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Dark blue background circle -->
  <circle cx="60" cy="60" r="56" fill="#0A1628"/>
  
  <!-- Brain hemisphere (stylized as circuit board) -->
  <g stroke="#4FC3F7" stroke-width="2" fill="none">
    <!-- Main brain outline -->
    <path d="M25 40 C20 35 20 30 25 25 C30 20 40 20 45 25 C50 20 60 20 65 25 C70 20 80 25 85 30 C90 35 90 40 85 45 C80 50 70 50 60 50 C50 50 40 50 30 50 C20 50 20 40 25 40"/>
    
    <!-- Circuit pattern inside brain -->
    <path d="M30 30 L40 25 L50 30"/>
    <path d="M40 35 L50 30 L60 35"/>
    <path d="M50 40 L60 35 L70 40"/>
    <path d="M35 35 L45 40 L55 35"/>
    <path d="M45 30 L55 25 L65 30"/>
    <path d="M40 25 L50 20 L60 25"/>
    <path d="M35 40 L45 45 L55 40"/>
    <path d="M45 35 L55 30 L65 35"/>
    
    <!-- Connection nodes -->
    <circle cx="35" cy="35" r="2.5" fill="#4FC3F7"/>
    <circle cx="55" cy="35" r="2.5" fill="#4FC3F7"/>
    <circle cx="45" cy="45" r="2.5" fill="#4FC3F7"/>
    <circle cx="50" cy="20" r="2.5" fill="#4FC3F7"/>
    <circle cx="40" cy="30" r="2" fill="#4FC3F7"/>
    <circle cx="60" cy="30" r="2.5" fill="#4FC3F7"/>
  </g>
  
  <!-- Roots extending down in Z pattern -->
  <g stroke="#4FC3F7" stroke-width="2" fill="none">
    <!-- Left root line -->
    <path d="M30 50 L25 75 L20 85"/>
    <!-- Middle root line -->
    <path d="M60 50 L60 75 L60 85"/>
    <!-- Right root line -->
    <path d="M90 50 L95 75 L100 85"/>
    
    <!-- Root terminals -->
    <circle cx="20" cy="85" r="2.5" fill="#4FC3F7"/>
    <circle cx="60" cy="85" r="2.5" fill="#4FC3F7"/>
    <circle cx="100" cy="85" r="2.5" fill="#4FC3F7"/>
  </g>
  
  <!-- Horizontal connectors forming Z shape -->
  <g stroke="#4FC3F7" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M20 85 L35 85"/>
    <path d="M45 85 L60 85"/>
    <path d="M65 85 L80 85"/>
    <path d="M85 85 L100 85"/>
  </g>
  
  <!-- Small circuit details -->
  <g stroke="#4FC3F7" stroke-width="1" fill="none" opacity="0.4">
    <path d="M35 30 L35 25"/>
    <path d="M65 30 L65 25"/>
    <path d="M45 50 L45 55"/>
    <path d="M55 50 L55 55"/>
    <path d="M30 50 L30 55"/>
    <path d="M90 50 L90 55"/>
  </g>
</svg>