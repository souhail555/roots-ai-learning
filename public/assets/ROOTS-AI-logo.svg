<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#0A1628"/>
  
  <!-- Brain circuit pattern -->
  <g stroke="#4FC3F7" stroke-width="2" fill="none">
    <!-- Brain outline -->
    <path d="M30 25 C25 20 25 15 30 10 C35 5 45 5 50 10 C55 5 65 5 70 10 C75 15 75 20 70 25 C75 30 75 35 70 40 C65 45 55 45 50 40 C45 45 35 45 30 40 C25 35 25 30 30 25"/>
    
    <!-- Circuit lines inside brain -->
    <path d="M35 20 L40 15 L45 20"/>
    <path d="M55 20 L60 15 L65 20"/>
    <path d="M35 25 L40 30 L45 25"/>
    <path d="M55 25 L60 30 L65 25"/>
    <path d="M35 30 L40 35 L45 30"/>
    <path d="M55 30 L60 35 L65 30"/>
    <path d="M40 35 L50 40 L60 35"/>
    <path d="M40 20 L50 15 L60 20"/>
    
    <!-- Connection dots -->
    <circle cx="40" cy="15" r="2" fill="#4FC3F7"/>
    <circle cx="60" cy="15" r="2" fill="#4FC3F7"/>
    <circle cx="40" cy="30" r="2" fill="#4FC3F7"/>
    <circle cx="60" cy="30" r="2" fill="#4FC3F7"/>
    <circle cx="50" cy="40" r="2" fill="#4FC3F7"/>
  </g>
  
  <!-- Z shape from roots -->
  <g stroke="#4FC3F7" stroke-width="2" fill="none">
    <!-- Left root going down -->
    <path d="M35 45 L30 55 L25 65"/>
    <!-- Middle root going down-right -->
    <path d="M50 45 L50 55 L50 65"/>
    <!-- Right root going down -->
    <path d="M65 45 L70 55 L75 65"/>
    
    <!-- Root tips -->
    <circle cx="25" cy="65" r="2" fill="#4FC3F7"/>
    <circle cx="50" cy="65" r="2" fill="#4FC3F7"/>
    <circle cx="75" cy="65" r="2" fill="#4FC3F7"/>
  </g>
  
  <!-- Small connecting lines between brain and roots -->
  <g stroke="#4FC3F7" stroke-width="1" fill="none" opacity="0.6">
    <line x1="35" y1="45" x2="35" y2="45"/>
    <line x1="50" y1="45" x2="50" y2="45"/>
    <line x1="65" y1="45" x2="65" y2="45"/>
  </g>
</svg>