<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Background with dark blue gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628"/>
      <stop offset="100%" style="stop-color:#0D1A30"/>
    </linearGradient>
    <linearGradient id="circuitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4FC3F7"/>
      <stop offset="100%" style="stop-color:#29B6F6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGradient)"/>
  
  <!-- Brain hemisphere with circuit pattern -->
  <g stroke="url(#circuitGradient)" stroke-width="2" fill="none" filter="url(#glow)">
    <!-- Left hemisphere outline -->
    <path d="M28 35 C20 30 20 25 28 20 C36 15 44 15 52 20 C60 15 68 15 76 20 C84 25 84 30 76 35 C68 40 60 40 52 40 C44 40 36 40 28 35"/>
    
    <!-- Circuit traces -->
    <path d="M30 28 L38 23 L46 28"/>
    <path d="M38 32 L46 28 L54 32"/>
    <path d="M46 36 L54 32 L62 36"/>
    <path d="M34 30 L42 36 L50 30"/>
    <path d="M42 24 L50 18 L58 24"/>
    <path d="M38 23 L46 17 L54 23"/>
    <path d="M34 32 L42 38 L50 32"/>
    <path d="M42 30 L50 24 L58 30"/>
    <path d="M50 28 L58 22 L66 28"/>
    
    <!-- Circuit nodes -->
    <circle cx="34" cy="30" r="2" fill="#4FC3F7"/>
    <circle cx="50" cy="30" r="2" fill="#4FC3F7"/>
    <circle cx="42" cy="38" r="2" fill="#4FC3F7"/>
    <circle cx="46" cy="17" r="2" fill="#4FC3F7"/>
    <circle cx="38" cy="24" r="1.5" fill="#4FC3F7"/>
    <circle cx="54" cy="24" r="2" fill="#4FC3F7"/>
    <circle cx="58" cy="28" r="1.5" fill="#4FC3F7"/>
    <circle cx="50" cy="23" r="1.5" fill="#4FC3F7"/>
  </g>
  
  <!-- Z shape connecting brain to roots -->
  <g stroke="url(#circuitGradient)" stroke-width="2.5" fill="none" filter="url(#glow)">
    <!-- Top horizontal of Z -->
    <path d="M24 40 L60 40"/>
    <!-- Diagonal of Z -->
    <path d="M60 40 L40 52"/>
    <!-- Bottom horizontal of Z -->
    <path d="M40 52 L80 52"/>
    
    <!-- Connection to roots -->
    <path d="M80 52 L80 64"/>
  </g>
  
  <!-- Root system -->
  <g stroke="url(#circuitGradient)" stroke-width="1.5" fill="none" filter="url(#glow)">
    <!-- Main roots extending from Z -->
    <path d="M24 64 L20 80 L16 88"/>
    <path d="M40 64 L40 80 L40 88"/>
    <path d="M56 64 L60 80 L64 88"/>
    <path d="M72 64 L80 80 L88 88"/>
    
    <!-- Secondary branches -->
    <path d="M20 80 L12 84"/>
    <path d="M40 80 L32 84"/>
    <path d="M40 80 L48 84"/>
    <path d="M60 80 L68 84"/>
    <path d="M80 80 L92 84"/>
    
    <!-- Root terminals -->
    <circle cx="16" cy="88" r="2" fill="#4FC3F7"/>
    <circle cx="40" cy="88" r="2" fill="#4FC3F7"/>
    <circle cx="64" cy="88" r="2" fill="#4FC3F7"/>
    <circle cx="88" cy="88" r="2" fill="#4FC3F7"/>
    <circle cx="12" cy="84" r="1.5" fill="#4FC3F7"/>
    <circle cx="32" cy="84" r="1.5" fill="#4FC3F7"/>
    <circle cx="48" cy="84" r="1.5" fill="#4FC3F7"/>
    <circle cx="68" cy="84" r="1.5" fill="#4FC3F7"/>
    <circle cx="92" cy="84" r="1.5" fill="#4FC3F7"/>
  </g>
  
  <!-- Horizontal connectors -->
  <g stroke="url(#circuitGradient)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M16 88 L28 88"/>
    <path d="M32 88 L36 88"/>
    <path d="M44 88 L52 88"/>
    <path d="M56 88 L60 88"/>
    <path d="M68 88 L76 88"/>
    <path d="M80 88 L88 88"/>
  </g>
</svg>